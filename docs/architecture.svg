<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Dayflow HRMS — System Architecture</title>
  <desc>Layered architecture: browser client, Next.js App Router, React state and hooks, data access, and Supabase Postgres.</desc>

  <defs>
    <style>
      .lane      { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; rx: 10; }
      .lane-tag  { font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }
      .box       { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; rx: 7; }
      .box-t     { font-size: 12px; font-weight: 600; fill: #111827; }
      .box-s     { font-size: 10px; fill: #6b7280; }
      .title     { font-size: 21px; font-weight: 700; fill: #111827; letter-spacing: -0.01em; }
      .sub       { font-size: 11.5px; fill: #6b7280; }
      .flow      { stroke: #9ca3af; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .flow-dash { stroke: #cbd5e1; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow-l); }
      .note      { font-size: 9.5px; fill: #9ca3af; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <!-- Canvas: a light card that reads correctly on both GitHub themes -->
  <rect x="0" y="0" width="1180" height="760" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>

  <text x="590" y="40" class="title" text-anchor="middle">Dayflow HRMS — Architecture</text>
  <text x="590" y="60" class="sub" text-anchor="middle">Next.js 16 App Router · React 19 · pure CSS design system · Supabase Postgres</text>

  <!-- ══════════ LANE 1: CLIENT ══════════ -->
  <rect class="lane" x="30" y="86" width="200" height="250"/>
  <text x="46" y="108" class="lane-tag" fill="#4f6ef7">Client</text>

  <rect class="box" x="46" y="122" width="168" height="46"/>
  <text x="60" y="141" class="box-t">Browser</text>
  <text x="60" y="156" class="box-s">Sidebar · Topbar · Pages</text>

  <rect class="box" x="46" y="180" width="168" height="46"/>
  <text x="60" y="199" class="box-t">Product Tour</text>
  <text x="60" y="214" class="box-s">driver.js · runs once</text>

  <rect class="box" x="46" y="238" width="168" height="46"/>
  <text x="60" y="257" class="box-t">Design System</text>
  <text x="60" y="272" class="box-s">9 CSS files · tokens</text>

  <rect class="box" x="46" y="296" width="168" height="26"/>
  <text x="60" y="313" class="box-s">No Tailwind · no CSS-in-JS</text>

  <!-- ══════════ LANE 2: ROUTING ══════════ -->
  <rect class="lane" x="256" y="86" width="196" height="250"/>
  <text x="272" y="108" class="lane-tag" fill="#d97706">Routing</text>

  <rect class="box" x="272" y="122" width="164" height="46"/>
  <text x="286" y="141" class="box-t">middleware.ts</text>
  <text x="286" y="156" class="box-s">Session cookie guard</text>

  <rect class="box" x="272" y="180" width="164" height="46"/>
  <text x="286" y="199" class="box-t">App Router</text>
  <text x="286" y="214" class="box-s">25 pages · RSC + client</text>

  <rect class="box" x="272" y="238" width="164" height="46"/>
  <text x="286" y="257" class="box-t">Route Handlers</text>
  <text x="286" y="272" class="box-s">16 API endpoints</text>

  <rect class="box" x="272" y="296" width="164" height="26"/>
  <text x="286" y="313" class="box-s">Role gate: ADMIN / EMPLOYEE</text>

  <!-- ══════════ LANE 3: STATE &amp; DOMAIN ══════════ -->
  <rect class="lane" x="478" y="86" width="356" height="420"/>
  <text x="494" y="108" class="lane-tag" fill="#059669">State &amp; Domain Logic</text>

  <rect class="box" x="494" y="122" width="324" height="56"/>
  <text x="508" y="142" class="box-t">HRMSProvider — single source of truth</text>
  <text x="508" y="158" class="box-s">Loads profiles · salaries · attendance · today's leave</text>
  <text x="508" y="171" class="box-s">Derives punch state · restores session · blocks inactive users</text>

  <!-- Hooks grid -->
  <rect class="box" x="494" y="190" width="156" height="44"/>
  <text x="506" y="208" class="box-t">usePayroll</text>
  <text x="506" y="222" class="box-s">Register · totals</text>

  <rect class="box" x="662" y="190" width="156" height="44"/>
  <text x="674" y="208" class="box-t">useLeaveRequests</text>
  <text x="674" y="222" class="box-s">Requests · decisions</text>

  <rect class="box" x="494" y="244" width="156" height="44"/>
  <text x="506" y="262" class="box-t">useOrgStructure</text>
  <text x="506" y="276" class="box-s">Dept → designation</text>

  <rect class="box" x="662" y="244" width="156" height="44"/>
  <text x="674" y="262" class="box-t">useLeaveCatalog</text>
  <text x="674" y="276" class="box-s">Types · balances</text>

  <rect class="box" x="494" y="298" width="156" height="44"/>
  <text x="506" y="316" class="box-t">useAttendance</text>
  <text x="506" y="330" class="box-s">Punch · team today</text>

  <rect class="box" x="662" y="298" width="156" height="44"/>
  <text x="674" y="316" class="box-t">useEmployees</text>
  <text x="674" y="330" class="box-s">Search · filter</text>

  <!-- Pure domain -->
  <rect class="box" x="494" y="356" width="324" height="52" fill="#f0fdf4" stroke="#a7f3d0"/>
  <text x="508" y="375" class="box-t">salaryCalculator.ts — pure, no I/O</text>
  <text x="508" y="391" class="box-s">Basic 50% · HRA 50% of basic · PF 12% of basic · PT slab</text>

  <rect class="box" x="494" y="420" width="324" height="70"/>
  <text x="508" y="439" class="box-t">Data access</text>
  <text x="508" y="455" class="box-s">supabase/org.ts — typed reads, every reference by uuid</text>
  <text x="508" y="470" class="box-s">supabase/write.ts — surfaces errors, drops unknown columns</text>
  <text x="508" y="484" class="box-s">and retries so a lagging schema never fails the whole row</text>

  <!-- ══════════ LANE 4: DATA ══════════ -->
  <rect class="lane" x="860" y="86" width="290" height="420"/>
  <text x="876" y="108" class="lane-tag" fill="#7c3aed">Supabase / Postgres</text>

  <rect class="box" x="876" y="122" width="258" height="80"/>
  <text x="890" y="141" class="box-t">Core tables</text>
  <text x="890" y="157" class="box-s">profiles · salaries · attendance</text>
  <text x="890" y="171" class="box-s">departments · designations</text>
  <text x="890" y="185" class="box-s">designation → exactly one department</text>

  <rect class="box" x="876" y="214" width="258" height="66"/>
  <text x="890" y="233" class="box-t">Leave (normalised)</text>
  <text x="890" y="249" class="box-s">leave_types · leave_requests</text>
  <text x="890" y="263" class="box-s">leave_balances — balance is GENERATED</text>

  <rect class="box" x="876" y="292" width="258" height="66"/>
  <text x="890" y="311" class="box-t">Views (one round trip)</text>
  <text x="890" y="327" class="box-s">employee_directory</text>
  <text x="890" y="341" class="box-s">leave_request_details · department_summary</text>

  <rect class="box" x="876" y="370" width="258" height="52"/>
  <text x="890" y="389" class="box-t">Add-ons</text>
  <text x="890" y="405" class="box-s">claims · it_assets · company_feed · esign_*</text>

  <rect class="box" x="876" y="434" width="258" height="56" fill="#fffbeb" stroke="#fde68a"/>
  <text x="890" y="453" class="box-t">Row Level Security</text>
  <text x="890" y="469" class="box-s">is_admin() · auth.uid() = owner</text>
  <text x="890" y="483" class="box-s">Policies on every table</text>

  <!-- ══════════ FLOW ARROWS ══════════ -->
  <path class="flow" d="M 230 200 L 252 200"/>
  <path class="flow" d="M 452 200 L 474 200"/>
  <path class="flow" d="M 834 200 L 856 200"/>
  <path class="flow-dash" d="M 856 320 L 834 320"/>
  <text x="700" y="530" class="note" text-anchor="middle">Solid = request · Dashed = data returned</text>

  <!-- ══════════ MIGRATIONS STRIP ══════════ -->
  <rect class="lane" x="30" y="528" width="1120" height="86"/>
  <text x="46" y="550" class="lane-tag" fill="#6b7280">Migrations — ordered, idempotent, non-destructive</text>

  <rect class="box" x="46" y="562" width="262" height="38"/>
  <text x="58" y="578" class="box-t">001 · optional columns</text>
  <text x="58" y="592" class="box-s">leave reason · attendance notes · PAN/UAN</text>

  <rect class="box" x="320" y="562" width="262" height="38"/>
  <text x="332" y="578" class="box-t">002 · org + leave</text>
  <text x="332" y="592" class="box-s">5 tables · 3 views · 11 indexes · RLS</text>

  <rect class="box" x="594" y="562" width="262" height="38"/>
  <text x="606" y="578" class="box-t">003 · profile status</text>
  <text x="606" y="592" class="box-s">is_active — deactivation blocks sign-in</text>

  <rect class="box" x="868" y="562" width="266" height="38"/>
  <text x="880" y="578" class="box-t">004 · add-on features</text>
  <text x="880" y="592" class="box-s">claims · it_assets · company_feed</text>

  <!-- ══════════ EXTERNAL ══════════ -->
  <rect class="lane" x="30" y="630" width="1120" height="100"/>
  <text x="46" y="652" class="lane-tag" fill="#6b7280">External &amp; Tooling</text>

  <rect class="box" x="46" y="664" width="206" height="48"/>
  <text x="58" y="683" class="box-t">Supabase</text>
  <text x="58" y="698" class="box-s">Postgres · PostgREST · Auth</text>

  <rect class="box" x="264" y="664" width="206" height="48"/>
  <text x="276" y="683" class="box-t">DocuSeal</text>
  <text x="276" y="698" class="box-s">E-signature · optional</text>

  <rect class="box" x="482" y="664" width="206" height="48"/>
  <text x="494" y="683" class="box-t">Vercel</text>
  <text x="494" y="698" class="box-s">Build &amp; hosting · Node 22</text>

  <rect class="box" x="700" y="664" width="206" height="48"/>
  <text x="712" y="683" class="box-t">lucide-react</text>
  <text x="712" y="698" class="box-s">Icons · tree-shaken</text>

  <rect class="box" x="918" y="664" width="216" height="48"/>
  <text x="930" y="683" class="box-t">driver.js</text>
  <text x="930" y="698" class="box-s">Guided product tour</text>
</svg>
