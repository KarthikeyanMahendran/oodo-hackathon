<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <!-- Day Gradient (Warm) -->
    <linearGradient id="dayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <!-- Flow Gradient (Cool) -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(10, 15)">
    <!-- The "Day" Sun -->
    <circle cx="50" cy="60" r="35" fill="url(#dayGrad)" opacity="0.9"/>
    <!-- The "Flow" Wave -->
    <path d="M 30 60 Q 80 5 110 60 Q 80 115 30 60" fill="url(#flowGrad)" opacity="0.95"/>
  </g>

  <!-- Typography -->
  <text x="140" y="100" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">
    <tspan fill="#1F2937">Day</tspan><tspan fill="#3B82F6">Flow</tspan>
  </text>
</svg>
