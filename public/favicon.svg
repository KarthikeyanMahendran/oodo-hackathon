<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Day Gradient (Warm) -->
    <linearGradient id="favDayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <!-- Flow Gradient (Cool) -->
    <linearGradient id="favFlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  
  <g transform="translate(0, 0)">
    <!-- The "Day" Sun -->
    <circle cx="50" cy="60" r="35" fill="url(#favDayGrad)" opacity="0.95"/>
    <!-- The "Flow" Wave -->
    <path d="M 30 60 Q 80 5 110 60 Q 80 115 30 60" fill="url(#favFlowGrad)" opacity="0.95"/>
  </g>
</svg>
